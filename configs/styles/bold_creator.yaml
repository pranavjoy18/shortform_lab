name: bold_creator
export:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
hook:
  duration_ms: 2800
  max_words: 8
captions:
  mode: sentence
  font_size: 64
  max_chars_per_line: 28
  position: bottom
  font_family: "Poppins ExtraBold"
  # ALL CAPS + a fade-in read as more "bold creator energy" than plain static
  # sentence-case text — the flat look this style used to ship with.
  uppercase: true
  animation_in: fade
visuals:
  punch_in_count: 2
  text_card_count: 2
  allow_stock_broll: false
audio:
  normalize: true
color:
  # Brighter, higher contrast — pairs with the punch-ins/quote cards for a
  # more energetic feel than the previous ungraded (flat) default.
  look: punchy

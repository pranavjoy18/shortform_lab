name: reels_letterbox
export:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
  # Preserve the whole landscape, centered with black bars top/bottom.
  layout: letterbox
hook:
  duration_ms: 2800
  max_words: 8
captions:
  mode: word
  word_animation: active_word
  highlight_color: "#FFE000"
  max_words_per_group: 4
  uppercase: true
  font_size: 56
  max_chars_per_line: 24
  # Captions land in the bottom black bar in letterbox layout.
  position: bottom
visuals:
  punch_in_count: 0
  text_card_count: 0
  allow_stock_broll: false
audio:
  normalize: true

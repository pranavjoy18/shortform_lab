name: karaoke
export:
  aspect_ratio: "9:16"
  width: 1080
  height: 1920
  fps: 30
hook:
  duration_ms: 2500
  max_words: 7
captions:
  mode: word
  word_animation: karaoke
  highlight_color: "#39E5FF"
  max_words_per_group: 5
  uppercase: false
  font_size: 54
  max_chars_per_line: 32
  position: bottom
  font_family: "Poppins ExtraBold"
visuals:
  punch_in_count: 1
  text_card_count: 1
  allow_stock_broll: false
audio:
  normalize: true
